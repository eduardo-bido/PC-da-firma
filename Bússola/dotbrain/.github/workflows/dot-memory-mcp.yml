name: Bússola Dot memory MCP checks
on:
  pull_request:
    paths:
      - 'src/lib/mcp/**'
      - 'tests/mcp-memory-helpers.test.mjs'
      - 'tests/mcp-episode-v2.test.mjs'
      - '.github/workflows/dot-memory-mcp.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node --experimental-strip-types --test tests/mcp-memory-helpers.test.mjs
      - run: node --experimental-strip-types --test tests/mcp-episode-v2.test.mjs
      - run: bun run test:mcp
      - run: bunx tsc --noEmit
      - run: bun run build

